[project]
name = "ecommerce-task"
version = "0.1.0"
description = "ETL pipeline for e-commerce sales data processing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy>=2.3.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "sqlalchemy>=2.1.1",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
